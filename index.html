<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フェルミ推定 参考データ辞書 | データ探偵事務所</title>
<style>
  :root{
    --navy:#0d1b2a;
    --navy2:#1b2838;
    --accent:#4fd1c5;
    --accent2:#f2a541;
    --text:#e8edf2;
    --dim:#8fa3b8;
    --line:#2a3b4d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Segoe UI",sans-serif;
    background:var(--navy);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--navy2),var(--navy));
  }
  header .tag{
    font-size:11px;
    letter-spacing:2px;
    color:var(--accent);
    text-transform:uppercase;
  }
  header h1{
    margin:4px 0 2px;
    font-size:20px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:12px;
    color:var(--dim);
  }
  .container{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .panel{
    background:var(--navy2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }
  .controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type=text], select, textarea{
    background:var(--navy);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:6px;
    font-size:14px;
    flex:1;
    min-width:120px;
  }
  select{flex:0 0 130px;}
  button{
    background:var(--accent);
    color:var(--navy);
    border:none;
    padding:9px 14px;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  .count{
    font-size:11px;
    color:var(--dim);
    margin:8px 2px 0;
  }
  .card{
    background:var(--navy2);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:8px;
    position:relative;
  }
  .card-actions{
    display:flex;
    gap:6px;
    justify-content:flex-end;
    margin-bottom:4px;
  }
  .card-actions button{
    padding:4px 9px;
    font-size:11px;
    font-weight:600;
  }
  .card .cat{
    font-size:10px;
    color:var(--accent2);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .card .term{
    font-size:15px;
    font-weight:700;
    margin:3px 0 4px;
  }
  .card .value{
    font-size:22px;
    font-weight:800;
    color:var(--accent);
  }
  .card .unit{
    font-size:12px;
    color:var(--dim);
    margin-left:4px;
    font-weight:400;
  }
  .card .meta{
    font-size:11px;
    color:var(--dim);
    margin-top:6px;
    line-height:1.5;
  }
  .card .tags{
    margin-top:6px;
  }
  .chip{
    display:inline-block;
    font-size:10px;
    background:var(--navy);
    border:1px solid var(--line);
    color:var(--dim);
    padding:2px 7px;
    border-radius:20px;
    margin-right:4px;
  }
  .copybtn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
  }
  .copybtn.done{color:var(--accent);border-color:var(--accent);}
  .addcalcbtn{
    background:transparent;
    border:1px solid var(--accent2);
    color:var(--accent2);
  }
  .gridaddbtn{
    background:transparent;
    border:1px solid #9b7ee8;
    color:#9b7ee8;
  }
  details summary{
    cursor:pointer;
    font-size:13px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:10px;
  }
  form label{
    display:block;
    font-size:11px;
    color:var(--dim);
    margin:8px 0 3px;
  }
  form .row{display:flex;gap:8px;}
  .status{font-size:12px;margin-top:8px;}
  .status.ok{color:var(--accent);}
  .status.err{color:#e05c5c;}
  .empty{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    padding:30px 10px;
  }
  .setup{
    font-size:12px;
    color:var(--dim);
    line-height:1.6;
  }
  .setup code{
    background:var(--navy);
    padding:1px 5px;
    border-radius:4px;
    color:var(--accent2);
  }

  /* --- 計算パネル --- */
  .calc-panel{
    border:1px solid var(--accent);
    background:linear-gradient(180deg,rgba(79,209,197,0.08),var(--navy2));
  }
  .calc-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .calc-header h2{
    font-size:13px;
    margin:0;
    color:var(--accent);
    letter-spacing:1px;
  }
  .calc-empty{
    font-size:12px;
    color:var(--dim);
    padding:10px 2px;
  }
  .factor-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--navy);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 9px;
    margin-bottom:6px;
  }
  .factor-row .frow-top{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .factor-row .frow-bottom{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .factor-row select.op{
    flex:0 0 48px;
    width:48px;
    padding:5px 2px;
    font-size:15px;
    text-align:center;
    font-weight:700;
    color:var(--accent2);
  }
  .factor-row .op-spacer{
    flex:0 0 48px;
    width:48px;
  }
  .factor-row input.flabel{
    flex:1 1 auto;
    min-width:0;
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    padding:4px 2px;
  }
  .factor-row input.flabel:focus{
    border-bottom:1px solid var(--accent);
    outline:none;
  }
  .factor-row input.fval{
    flex:1 1 auto;
    min-width:0;
    padding:6px 8px;
    font-size:13px;
    text-align:right;
  }
  .factor-row .funit{
    flex:0 0 auto;
    font-size:11px;
    color:var(--dim);
    min-width:32px;
    text-align:left;
  }
  .factor-row .frm{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:var(--dim);
    font-size:15px;
    padding:2px 6px;
  }
  .calc-result{
    margin-top:10px;
    padding:12px;
    background:var(--navy);
    border:1px dashed var(--accent);
    border-radius:8px;
    text-align:center;
  }
  .calc-result .rval{
    font-size:26px;
    font-weight:800;
    color:var(--accent);
  }
  .calc-result .rjp{
    font-size:12px;
    color:var(--dim);
    margin-top:2px;
  }
  .calc-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  /* --- 9マス因数分解 --- */
  .mandala-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
    margin-top:4px;
  }
  .mcell{
    background:var(--navy);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px;
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
    position:relative;
  }
  .mcell.center{
    background:linear-gradient(160deg,rgba(242,165,65,0.15),var(--navy));
    border:1px solid var(--accent2);
  }
  .mcell.center textarea{
    background:transparent;
    border:none;
    color:var(--accent2);
    font-weight:700;
    font-size:12px;
    resize:none;
    width:100%;
    height:100%;
    text-align:center;
    padding:0;
  }
  .mcell input.mlabel{
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line);
    color:var(--dim);
    font-size:10px;
    padding:2px 0;
    width:100%;
    text-align:center;
  }
  .mcell input.mvalue{
    background:transparent;
    border:none;
    color:var(--accent);
    font-size:15px;
    font-weight:800;
    text-align:center;
    width:100%;
    padding:1px 0;
  }
  .mcell input.munit{
    background:transparent;
    border:none;
    color:var(--dim);
    font-size:10px;
    text-align:center;
    width:100%;
    padding:0;
  }
  .mcell .mrm{
    position:absolute;
    top:2px;
    right:4px;
    background:transparent;
    border:none;
    color:var(--dim);
    font-size:11px;
    padding:0;
  }
  .mandala-result{
    margin-top:10px;
    padding:12px;
    background:var(--navy);
    border:1px dashed var(--accent2);
    border-radius:8px;
    text-align:center;
  }
  .mandala-result .rval{
    font-size:24px;
    font-weight:800;
    color:var(--accent2);
  }
  .mandala-result .rjp{
    font-size:12px;
    color:var(--dim);
    margin-top:2px;
  }
</style>
</head>
<body>

<header>
  <div class="tag">データ探偵事務所</div>
  <h1>フェルミ推定 参考データ辞書</h1>
  <p>人口統計・市場規模などの数値を蓄積して検索できる辞書ツール</p>
</header>

<div class="container">

  <div class="panel" id="setupPanel">
    <div class="setup">
      <strong style="color:var(--text)">初回セットアップ</strong><br>
      1. Code.gs をスプレッドシートの拡張機能 &gt; Apps Script に貼り付けてデプロイ<br>
      2. 発行されたウェブアプリURLを下に貼り付けて保存
    </div>
    <div class="controls" style="margin-top:10px;">
      <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/xxxx/exec">
      <button onclick="saveGasUrl()">保存</button>
    </div>
    <div class="status" id="setupStatus"></div>
  </div>

  <div class="panel">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="項目名・タグ・出典で検索">
      <select id="categoryFilter"><option value="">全カテゴリ</option></select>
    </div>
    <div class="count" id="countLabel"></div>
    <div style="margin-top:6px;">
      <button class="secondary" onclick="reopenSetup()" style="font-size:11px;padding:4px 9px;">GASのURLを再設定</button>
    </div>
  </div>

  <div class="panel calc-panel">
    <div class="calc-header">
      <h2>🧮 フェルミ推定 計算式</h2>
      <button class="secondary" onclick="clearCalc()" style="padding:4px 10px;font-size:11px;">クリア</button>
    </div>
    <div id="calcFactors"></div>
    <div class="calc-result" id="calcResult" style="display:none;">
      <div class="rval" id="calcResultVal"></div>
      <div class="rjp" id="calcResultJp"></div>
    </div>
    <div class="calc-actions">
      <button class="secondary" onclick="collapseToSubtotal()" style="flex:1;" id="subtotalBtn" disabled>この結果を次の項目にする</button>
      <button class="secondary" onclick="addManualFactor()" style="flex:1;">+ 手動で値を追加</button>
    </div>
    <div class="calc-actions">
      <button onclick="openSaveCalc()" style="flex:1;" id="saveCalcBtn" disabled>結果を辞書に保存</button>
    </div>
    <div id="saveCalcForm" style="display:none;margin-top:10px;">
      <input type="text" id="calcResultTerm" placeholder="項目名(例: 阿佐ヶ谷駅 想定市場規模)">
      <div class="controls" style="margin-top:6px;">
        <input type="text" id="calcResultCategory" placeholder="カテゴリ(例: フェルミ推定結果)" value="フェルミ推定結果">
        <button onclick="submitCalcSave()">保存</button>
      </div>
      <div class="status" id="calcSaveStatus"></div>
    </div>
  </div>

  <div class="panel">
    <div class="calc-header">
      <h2 style="color:#9b7ee8;">🔢 因数分解(9マス)</h2>
      <button class="secondary" onclick="clearGrid()" style="padding:4px 10px;font-size:11px;">クリア</button>
    </div>
    <div class="mandala-grid" id="mandalaGrid"></div>
    <div class="mandala-result" id="mandalaResult" style="display:none;">
      <div class="rval" id="mandalaResultVal"></div>
      <div class="rjp" id="mandalaResultJp"></div>
    </div>
    <div class="calc-actions">
      <button onclick="openSaveGrid()" style="flex:1;" id="saveGridBtn" disabled>結果を辞書に保存</button>
    </div>
    <div id="saveGridForm" style="display:none;margin-top:10px;">
      <input type="text" id="gridResultCategory" placeholder="カテゴリ(例: フェルミ推定結果)" value="フェルミ推定結果">
      <div class="status" id="gridSaveStatus"></div>
      <button style="margin-top:6px;width:100%;" onclick="submitGridSave()">保存(項目名はお題を使用)</button>
    </div>
  </div>

  <div id="results"></div>

  <div class="panel">
    <details>
      <summary>+ 新しいデータを辞書に追加</summary>
      <form id="addForm">
        <label>カテゴリ</label>
        <input type="text" id="f_category" placeholder="例: 人口統計 / 市場規模 / 単価">
        <label>項目名</label>
        <input type="text" id="f_term" placeholder="例: 阿佐ヶ谷駅 1日乗降客数">
        <div class="row">
          <div style="flex:1">
            <label>値</label>
            <input type="text" id="f_value" placeholder="例: 45000">
          </div>
          <div style="flex:1">
            <label>単位</label>
            <input type="text" id="f_unit" placeholder="例: 人/日">
          </div>
        </div>
        <label>出典</label>
        <input type="text" id="f_source" placeholder="例: JR東日本 2024年度データ">
        <div class="row">
          <div style="flex:1">
            <label>年</label>
            <input type="text" id="f_year" placeholder="例: 2024">
          </div>
          <div style="flex:2">
            <label>タグ(カンマ区切り)</label>
            <input type="text" id="f_tags" placeholder="例: 中央線,駅,交通">
          </div>
        </div>
        <label>備考</label>
        <textarea id="f_notes" rows="2" placeholder="計算での使い方や注意点など"></textarea>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button type="submit">辞書に追加</button>
          <button type="button" class="secondary" onclick="refreshData()">再読込</button>
        </div>
        <div class="status" id="addStatus"></div>
      </form>
    </details>
  </div>

</div>

<script>
let allItems = [];
let currentFiltered = [];
let calcFactors = [];
let GAS_URL = localStorage.getItem('fermiDictGasUrl') || '';


function parseNum(v){
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function addFactorFromItem(idx){
  const item = currentFiltered[idx];
  if(!item) return;
  calcFactors.push({
    label: item['項目名'] || '(無題)',
    value: parseNum(item['値']),
    unit: item['単位'] || '',
    op: calcFactors.length === 0 ? '×' : '×'
  });
  renderCalc();
}

function addManualFactor(){
  calcFactors.push({ label: '手動入力', value: 1, unit: '', op: '×' });
  renderCalc();
}

function removeFactor(i){
  calcFactors.splice(i, 1);
  renderCalc();
}

function updateFactorValue(i, val){
  calcFactors[i].value = parseNum(val);
  renderCalc();
}

function updateFactorOp(i, op){
  calcFactors[i].op = op;
  renderCalc();
}

function updateFactorLabel(i, val){
  calcFactors[i].label = val;
}

// --- 9マス因数分解(表示専用。中身は上の「計算式」と同じcalcFactorsを使う) ---
let gridTopic = '';

function renderGrid(){
  const order = [0,1,2, 3,'center',4, 5,6,7]; // 3x3表示順。'center'はお題マス
  const container = document.getElementById('mandalaGrid');
  container.innerHTML = order.map(pos => {
    if(pos === 'center'){
      return `<div class="mcell center">
        <textarea placeholder="お題(例: 阿佐ヶ谷の美容室市場規模は?)" onchange="updateGridTopic(this.value)">${escapeHtml(gridTopic)}</textarea>
      </div>`;
    }
    const f = calcFactors[pos];
    if(!f){
      return `<div class="mcell"><div style="text-align:center;font-size:10px;color:var(--dim);">空き</div></div>`;
    }
    return `<div class="mcell">
      <div style="text-align:center;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.label)}</div>
      <div style="text-align:center;font-size:15px;font-weight:800;color:var(--accent);">${formatNumber(f.value)}</div>
      <div style="text-align:center;font-size:10px;color:var(--dim);">${escapeHtml(f.unit)}</div>
    </div>`;
  }).join('');

  const resultBox = document.getElementById('mandalaResult');
  const saveBtn = document.getElementById('saveGridBtn');
  if(calcFactors.length === 0){
    resultBox.style.display = 'none';
    saveBtn.disabled = true;
    document.getElementById('saveGridForm').style.display = 'none';
    return;
  }
  resultBox.style.display = 'block';
  document.getElementById('mandalaResultVal').textContent = formatNumber(window._lastCalcResult);
  document.getElementById('mandalaResultJp').textContent = formatJP(window._lastCalcResult);
  saveBtn.disabled = false;
  window._lastGridResult = window._lastCalcResult;
}

function updateGridTopic(val){
  gridTopic = val;
}

function clearGrid(){
  gridTopic = '';
  clearCalc();
}
function openSaveGrid(){
  const form = document.getElementById('saveGridForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}
async function submitGridSave(){
  const statusEl = document.getElementById('gridSaveStatus');
  const term = gridTopic.trim() || '因数分解の推定結果';
  const category = document.getElementById('gridResultCategory').value.trim() || 'フェルミ推定結果';
  if(!GAS_URL){
    statusEl.textContent = '先にGASのURLを設定してください';
    statusEl.className = 'status err';
    return;
  }
  const formula = calcFactors.map((f, i) => (i===0 ? '' : ' ' + f.op + ' ') + f.value + (f.unit || '') + `(${f.label})`).join('');
  const payload = {
    category: category,
    term: term,
    value: Math.round(window._lastGridResult * 100) / 100,
    unit: '',
    source: 'フェルミ推定 因数分解(9マス)',
    year: '',
    notes: 'お題: ' + term + ' / 計算式: ' + formula,
    tags: 'フェルミ推定,因数分解'
  };
  statusEl.textContent = '送信中...';
  statusEl.className = 'status ok';
  try{
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if(data.status !== 'ok') throw new Error(data.message || '送信エラー');
    statusEl.textContent = '辞書に保存しました';
    statusEl.className = 'status ok';
    refreshData();
  }catch(err){
    statusEl.textContent = 'エラー: ' + err.message;
    statusEl.className = 'status err';
  }
}

function collapseToSubtotal(){
  if(calcFactors.length === 0) return;
  const result = window._lastCalcResult;
  calcFactors = [{ label: '小計', value: Math.round(result * 100) / 100, unit: '', op: '×' }];
  renderCalc();
}

function clearCalc(){
  calcFactors = [];
  renderCalc();
}

function renderCalc(){
  const container = document.getElementById('calcFactors');
  if(calcFactors.length === 0){
    container.innerHTML = '<div class="calc-empty">辞書カードの「計算へ+」、または「手動で値を追加」で計算式を組み立てます</div>';
    document.getElementById('calcResult').style.display = 'none';
    document.getElementById('saveCalcBtn').disabled = true;
    document.getElementById('subtotalBtn').disabled = true;
    document.getElementById('saveCalcForm').style.display = 'none';
    renderGrid();
    return;
  }
  container.innerHTML = calcFactors.map((f, i) => `
    <div class="factor-row">
      <div class="frow-top">
        ${i === 0
          ? '<span class="op-spacer"></span>'
          : `<select class="op" onchange="updateFactorOp(${i}, this.value)">
              <option value="×" ${f.op==='×'?'selected':''}>×</option>
              <option value="÷" ${f.op==='÷'?'selected':''}>÷</option>
              <option value="+" ${f.op==='+'?'selected':''}>+</option>
              <option value="−" ${f.op==='−'?'selected':''}>−</option>
            </select>`
        }
        <input type="text" class="flabel" placeholder="項目名(例: 客単価)" value="${escapeAttr(f.label)}" onchange="updateFactorLabel(${i}, this.value)">
      </div>
      <div class="frow-bottom">
        <span class="op-spacer"></span>
        <input type="text" class="fval" value="${f.value}" onchange="updateFactorValue(${i}, this.value)">
        <div class="funit">${escapeHtml(f.unit)}</div>
        <button class="frm" onclick="removeFactor(${i})">✕</button>
      </div>
    </div>
  `).join('');

  let result = calcFactors[0].value;
  for(let i = 1; i < calcFactors.length; i++){
    const f = calcFactors[i];
    if(f.op === '×') result *= f.value;
    else if(f.op === '÷') result = f.value !== 0 ? result / f.value : 0;
    else if(f.op === '+') result += f.value;
    else if(f.op === '−') result -= f.value;
  }

  document.getElementById('calcResult').style.display = 'block';
  document.getElementById('calcResultVal').textContent = formatNumber(result);
  document.getElementById('calcResultJp').textContent = formatJP(result);
  document.getElementById('saveCalcBtn').disabled = false;
  document.getElementById('subtotalBtn').disabled = false;
  window._lastCalcResult = result;
  renderGrid();
}

function formatNumber(n){
  return Math.round(n * 100) / 100 === Math.round(n)
    ? Math.round(n).toLocaleString('ja-JP')
    : (Math.round(n * 100) / 100).toLocaleString('ja-JP');
}

function formatJP(n){
  const abs = Math.abs(n);
  if(abs >= 1e8){
    return (n / 1e8).toFixed(2) + '億';
  } else if(abs >= 1e4){
    return (n / 1e4).toFixed(1) + '万';
  }
  return '';
}

function openSaveCalc(){
  const form = document.getElementById('saveCalcForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function submitCalcSave(){
  const term = document.getElementById('calcResultTerm').value.trim();
  const category = document.getElementById('calcResultCategory').value.trim() || 'フェルミ推定結果';
  const statusEl = document.getElementById('calcSaveStatus');
  if(!term){
    statusEl.textContent = '項目名を入力してください';
    statusEl.className = 'status err';
    return;
  }
  if(!GAS_URL){
    statusEl.textContent = '先にGASのURLを設定してください';
    statusEl.className = 'status err';
    return;
  }
  const formula = calcFactors.map((f, i) => (i===0 ? '' : ' ' + f.op + ' ') + f.value + (f.unit ? f.unit : '') + (f.label ? `(${f.label})` : '')).join('');
  const payload = {
    category: category,
    term: term,
    value: Math.round(window._lastCalcResult * 100) / 100,
    unit: '',
    source: 'フェルミ推定計算(辞書データより算出)',
    year: '',
    notes: '計算式: ' + formula,
    tags: 'フェルミ推定,計算結果'
  };
  statusEl.textContent = '送信中...';
  statusEl.className = 'status ok';
  try{
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if(data.status !== 'ok') throw new Error(data.message || '送信エラー');
    statusEl.textContent = '辞書に保存しました';
    statusEl.className = 'status ok';
    document.getElementById('calcResultTerm').value = '';
    refreshData();
  }catch(err){
    statusEl.textContent = 'エラー: ' + err.message;
    statusEl.className = 'status err';
  }
}

function initSetupPanel(){
  const panel = document.getElementById('setupPanel');
  if (GAS_URL){
    document.getElementById('gasUrlInput').value = GAS_URL;
    panel.style.display = 'none';
  }
}

function reopenSetup(){
  document.getElementById('setupPanel').style.display = 'block';
  document.getElementById('setupStatus').textContent = '';
  window.scrollTo(0, 0);
}

function saveGasUrl(){
  const url = document.getElementById('gasUrlInput').value.trim();
  if(!url){ return; }
  GAS_URL = url;
  localStorage.setItem('fermiDictGasUrl', url);
  document.getElementById('setupStatus').textContent = '保存しました。データを読み込みます...';
  document.getElementById('setupStatus').className = 'status ok';
  refreshData();
}

async function refreshData(){
  if(!GAS_URL){
    document.getElementById('results').innerHTML = '<div class="empty">上のセットアップ欄にGASのウェブアプリURLを入力してください</div>';
    return;
  }
  document.getElementById('results').innerHTML = '<div class="empty">読み込み中...</div>';
  try{
    const res = await fetch(GAS_URL);
    const data = await res.json();
    if(data.status !== 'ok') throw new Error(data.message || '取得エラー');
    allItems = data.items || [];
    document.getElementById('setupPanel').style.display = 'none';
    populateCategories();
    renderResults();
  }catch(err){
    document.getElementById('results').innerHTML =
      '<div class="empty">読み込みに失敗しました: ' + escapeHtml(err.message) + '<br>URLやデプロイ設定(全員がアクセス可)を確認してください</div>';
  }
}

function populateCategories(){
  const sel = document.getElementById('categoryFilter');
  const cats = [...new Set(allItems.map(i => i['カテゴリ']).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">全カテゴリ</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

function renderResults(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;

  const filtered = allItems.filter(item => {
    if(cat && item['カテゴリ'] !== cat) return false;
    if(!q) return true;
    const haystack = [item['項目名'], item['タグ'], item['出典'], item['備考']]
      .join(' ').toLowerCase();
    return haystack.includes(q);
  });

  document.getElementById('countLabel').textContent = `${filtered.length} 件 / 全${allItems.length}件`;
  currentFiltered = filtered;

  const container = document.getElementById('results');
  if(filtered.length === 0){
    container.innerHTML = '<div class="empty">該当するデータがありません</div>';
    return;
  }

  container.innerHTML = filtered.map((item, idx) => {
    const tags = (item['タグ'] || '').split(',').map(t => t.trim()).filter(Boolean);
    return `
      <div class="card">
        <div class="card-actions">
          <button class="addcalcbtn" onclick="addFactorFromItem(${idx})">計算へ+</button>
          <button class="copybtn" onclick="copyValue(this, '${escapeAttr(item['値'])}')">コピー</button>
        </div>
        <div class="cat">${escapeHtml(item['カテゴリ'] || '未分類')}</div>
        <div class="term">${escapeHtml(item['項目名'] || '')}</div>
        <div><span class="value">${escapeHtml(item['値'] || '-')}</span><span class="unit">${escapeHtml(item['単位'] || '')}</span></div>
        <div class="meta">
          ${item['出典'] ? '出典: ' + escapeHtml(item['出典']) : ''}
          ${item['年'] ? '(' + escapeHtml(item['年']) + '年)' : ''}
          ${item['備考'] ? '<br>' + escapeHtml(item['備考']) : ''}
        </div>
        ${tags.length ? '<div class="tags">' + tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('') + '</div>' : ''}
      </div>
    `;
  }).join('');
}

function copyValue(btn, value){
  navigator.clipboard.writeText(value).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ コピー済';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 1500);
  });
}

document.getElementById('searchInput').addEventListener('input', renderResults);
document.getElementById('categoryFilter').addEventListener('change', renderResults);

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!GAS_URL){
    setAddStatus('先にGASのURLを設定してください', false);
    return;
  }
  const payload = {
    category: document.getElementById('f_category').value.trim(),
    term: document.getElementById('f_term').value.trim(),
    value: document.getElementById('f_value').value.trim(),
    unit: document.getElementById('f_unit').value.trim(),
    source: document.getElementById('f_source').value.trim(),
    year: document.getElementById('f_year').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    tags: document.getElementById('f_tags').value.trim()
  };
  if(!payload.term || !payload.value){
    setAddStatus('項目名と値は必須です', false);
    return;
  }
  setAddStatus('送信中...', true);
  try{
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.status !== 'ok') throw new Error(data.message || '送信エラー');
    setAddStatus('追加しました', true);
    document.getElementById('addForm').reset();
    refreshData();
  }catch(err){
    setAddStatus('エラー: ' + err.message, false);
  }
});

function setAddStatus(msg, ok){
  const el = document.getElementById('addStatus');
  el.textContent = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){
  return String(str || '').replace(/'/g, "\\'");
}

initSetupPanel();
renderCalc();
renderGrid();
if(GAS_URL) refreshData();
</script>

</body>
</html>
